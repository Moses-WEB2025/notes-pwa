<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- Нативный вид: запрет зума и масштабирования -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- Стартовое значение; дальше JS перекрашивает его под текущий экран
       (scripts/edge.js). Совпадает с фоном экрана по умолчанию (--bg). -->
  <meta name="theme-color" content="#f7f7f7" />
  <!-- Приложение только светлое: сообщаем системе, чтобы она не инвертировала
       страницу и подбирала контрастные иконки в системных зонах. -->
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Заметки — офлайн PWA" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- apple-mobile-web-app-status-bar-style намеренно НЕ задаём: с iOS 26
       black-translucent устарел, а Home Screen web app не рисует контент под
       статус-баром — Safari сам красит его цветом фона body (см. edge.js). -->
  <meta name="apple-mobile-web-app-title" content="Заметки" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <title>Заметки</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/screens.css" />
</head>
<body>
  <div id="screens-root"></div>

  <!-- Тосты -->
  <div class="toast-holder" id="toast-holder"></div>

  <script type="module" src="scripts/app.js"></script>
  <script>
    // Service Worker — полный офлайн
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }

    // Блокируем мультитач-зум
    document.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // Запрет двойного тапа-зума
    let lastTouchend = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchend <= 300) e.preventDefault();
      lastTouchend = now;
    }, { passive: false });

    // Запрет контекстного меню (долгое нажатие на текст/картинку)
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Блокировка обновления страницы (F5 / Ctrl+R) — ведём себя как нативное приложение
    window.addEventListener('keydown', (e) => {
      const isReload = e.key === 'F5' || ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'r' || e.key === 'R'));
      if (isReload) e.preventDefault();
    }, { passive: false });

    // Перехват «назад» (системный жест / кнопка) — как в нативных приложениях.
    // Держим над базовой записью постоянную «страж»-запись: тогда любой свайп
    // «назад» остаётся внутри документа и вызывает popstate, а не закрывает
    // приложение уходом на предыдущую страницу.
    history.replaceState({ app: 1 }, '');
    history.pushState({ app: 1 }, '');
    window.addEventListener('popstate', () => {
      document.dispatchEvent(new CustomEvent('app-back'));
      history.pushState({ app: 1 }, '');
    });
  </script>
</body>
</html>
